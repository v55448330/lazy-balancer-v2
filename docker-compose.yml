services:
  # 主从两个容器共用同一镜像（image 标签与 Docker Hub 推送的一致）。
  # 本地开发迭代时执行：docker compose build lazy-balancer && docker compose up -d
  lazy-balancer:
    image: v55448330/lazy-balancer-v2:v2.3.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    build:
      context: .
      args:
        VERSION: v2.3.0
    container_name: lazy-balancer
    network_mode: host
    # Port mapping is not used with host network; Caddy binds directly to host ports.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./waf:/app/waf
      # 自动备份落盘目录（v2.3.x，仅主节点调度写入；测试环境两容器共享目录无竞争）
      - ./backup:/app/backup
    environment:
      - TZ=Asia/Shanghai
      - NODE_NAME=master
      - LOG_FILE=/app/logs/lazy-balancer.log
    restart: unless-stopped
    # 生产 fd 上限：每个连接一个 fd（含 TLS/日志），默认 1024 在 LB 场景必炸。
    # 详见 docs/production-tuning.zh-CN.md §1
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

  # 从节点测试实例：bridge 网络，仅将容器 8000 映射到宿主机 8001，避免与主节点(host 网络)端口冲突
  # 主节点地址注册时填写: http://host.docker.internal:8000
  lazy-balancer-slave:
    image: v55448330/lazy-balancer-v2:v2.3.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    container_name: lazy-balancer-slave
    ports:
      - "8001:8000"
    volumes:
      - ./data-slave:/app/data
      - ./logs-slave:/app/logs
      - ./certs-slave:/app/certs
      # 独立 WAF 目录：两节点的 CRS/IP2Region 每日更新会并发写共享目录，存在竞争
      - ./waf-slave:/app/waf
      # 与主节点共享备份目录：从节点不调度写入，仅目录存在以保配置路径一致
      - ./backup:/app/backup
    environment:
      - TZ=Asia/Shanghai
      - NODE_NAME=slave-test
      - LOG_FILE=/app/logs/lazy-balancer.log
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    restart: unless-stopped

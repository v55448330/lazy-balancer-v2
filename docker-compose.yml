version: '3.8'

services:
  lazy-balancer:
    build: .
    container_name: lazy-balancer
    network_mode: host
    # Port mapping is not used with host network; Caddy binds directly to host ports.
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=zdy123.org
      - NODE_NAME=master
      - NODE_MODE=master
      # Uncomment for slave mode:
      # - NODE_MODE=slave
      # - MASTER_URL=http://10.0.0.1:8000
      # DNSPod credentials (optional):
      # - DNSPOD_ID=your_id
      # - DNSPOD_TOKEN=your_token
    restart: unless-stopped
services:
  # 主从两个容器共用同一镜像（image 标签与 Docker Hub 推送的一致）。
  # 本地开发迭代时执行：docker compose build lazy-balancer && docker compose up -d
  lazy-balancer:
    image: v55448330/lazy-balancer-v2:v2.1.11
    build:
      context: .
      args:
        VERSION: 2.1.11
    container_name: lazy-balancer
    network_mode: host
    # Port mapping is not used with host network; Caddy binds directly to host ports.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./waf:/app/waf
    environment:
      - TZ=Asia/Shanghai
      - NODE_NAME=master
      - LOG_FILE=/app/logs/lazy-balancer.log
    restart: unless-stopped

  # 从节点测试实例：bridge 网络，仅将容器 8000 映射到宿主机 8001，避免与主节点(host 网络)端口冲突
  # 主节点地址注册时填写: http://host.docker.internal:8000
  lazy-balancer-slave:
    image: v55448330/lazy-balancer-v2:v2.1.11
    container_name: lazy-balancer-slave
    ports:
      - "8001:8000"
    volumes:
      - ./data-slave:/app/data
      - ./logs-slave:/app/logs
      - ./certs-slave:/app/certs
      # 独立 WAF 目录：两节点的 CRS/IP2Region 每日更新会并发写共享目录，存在竞争
      - ./waf-slave:/app/waf
    environment:
      - TZ=Asia/Shanghai
      - NODE_NAME=slave-test
      - LOG_FILE=/app/logs/lazy-balancer.log
    restart: unless-stopped

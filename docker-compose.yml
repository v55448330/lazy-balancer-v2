# 主从共用配置锚点——logging/ulimits/healthcheck 三处逐字重复收敛为单份
#（双份维护改一侧忘另一侧即分叉）。
x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
x-common-ulimits: &common-ulimits
  # 生产 fd 上限：每个连接一个 fd（含 TLS/日志），默认 1024 在 LB 场景必炸。
  # 详见 docs/production-tuning.zh-CN.md §1
  nofile:
    soft: 1048576
    hard: 1048576
x-common-healthcheck: &common-healthcheck
  # 与镜像 HEALTHCHECK 同一实现：二进制自带子命令（exec 形式，零 shell）。
  # 旧 CMD-SHELL 形态每 30s 派生 sh + HTTP 客户端子进程，在 PID 1 不回收孤儿
  # 的容器里会持续累积僵尸并打满 cgroup pids 配额（生产实证）。
  # 语义：HTTPS 先行 → 明文回落，只认第一跳 200、不跟随跳转。
  # 端口同镜像：容器内面板口恒为 8000（entrypoint 不传 -config，数据库/文件里的
  # port 只对裸机自定义启动生效）；改探针端口须与 Dockerfile HEALTHCHECK 同步。
  test: ["CMD", "/usr/local/bin/lazy-balancer", "--healthcheck"]
  interval: 30s
  timeout: 5s
  retries: 3
  # 与镜像 HEALTHCHECK --start-period=90s 对齐（compose healthcheck 会整体替换
  # 镜像定义）：冷启动含 CRS 种子/证书物化/启动回放，30s 宽限在慢盘下必然
  # 探针失败，容器在预期启动窗口内误显 unhealthy。
  start_period: 90s

services:
  # 主从两个容器共用同一镜像（image 标签与 Docker Hub 推送的一致）。
  # 本地开发迭代时执行：docker compose build lazy-balancer && docker compose up -d
  #
  # 平台口径：主节点固定 network_mode: host，仅适用于 Linux 宿主。
  # Docker Desktop（macOS/Windows）的 host 网络支持依版本/设置而异，默认请按
  # README「快速开始」的 Docker Desktop 命令（bridge + -p 8000/80/443/443-udp
  # + named volume）启动，而非直接 docker compose up。
  lazy-balancer:
    image: v55448330/lazy-balancer-v2:v2.3.9-beta
    logging: *common-logging
    build:
      context: .
      args:
        # 版本号硬编码点之一（本行即 compose build.args.VERSION）。全仓其余
        # 位置=Dockerfile ARG VERSION、本文件两处 image tag、README 两版
        # docker build 示例（--build-arg VERSION 与镜像 tag）、
        # web/src/utils/branding.ts 的 appVersion 回退值；发布时另需 buildx
        # --build-arg 显式传参。以上各处须同步递增。
        # VERSION=正式版本号（v2.3.9，镜像内 APP_VERSION 同口径）；beta 通道
        # 只在 image tag 上加 -beta 后缀（上方两处 tag=v2.3.9-beta）。
        VERSION: v2.3.9
    container_name: lazy-balancer
    network_mode: host
    # Port mapping is not used with host network; Caddy binds directly to host ports.
    volumes:
      - lb-data:/app/data # named volume：SQLite WAL 不经宿主共享层（gRPC FUSE/VirtioFS 丢页族根治，2026-09-20 两次事故后裁定）
      - ./logs:/app/logs
      - ./certs:/app/certs
      - ./waf:/app/waf
      # 自动备份落盘目录（v2.3.x，仅主节点调度写入；测试环境两容器共享目录无竞争）
      - ./backup:/app/backup
    environment:
      - NODE_NAME=master
      - LOG_FILE=/app/logs/lazy-balancer.log
    restart: unless-stopped
    # PID1 退出前 POST Caddy admin /stop 排水在途连接，
    # grace period 覆盖 HTTP ≤10s Shutdown + Caddy 排水窗口。
    stop_grace_period: 30s
    healthcheck: *common-healthcheck
    ulimits: *common-ulimits
    # PID 配额（按线程计数）默认 4096：面板 + Caddy + 定时任务在高连接场景
    # 下线程数可达数百，Docker 默认值偏紧；配额打满时容器内无法 fork。
    pids_limit: 4096

  # 从节点测试实例：bridge 网络，仅将容器 8000 映射到宿主机 8001，避免与主节点(host 网络)端口冲突
  # 注册主节点地址时填 http://host.docker.internal:8000——下方 extra_hosts 把该主机名
  # 解析到宿主网关，Linux 宿主（本文件唯一支持的平台）同样可达，不再依赖 Docker
  # Desktop 的默认注入。Docker < 20.10 不认 host-gateway 时，改填宿主 LAN 地址，
  # 例如 http://192.168.1.10:8000（host 网络下主节点直接监听宿主端口）。
  lazy-balancer-slave:
    image: v55448330/lazy-balancer-v2:v2.3.9-beta
    logging: *common-logging
    container_name: lazy-balancer-slave
    # 宿主网关别名：bridge 网络内解析 host.docker.internal 到宿主，Linux 宿主
    # 需要它（Docker Desktop 才默认提供），注册主节点地址依赖该主机名。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    volumes:
      - lb-data-slave:/app/data # 同上（从节点独立卷）
      - ./logs-slave:/app/logs
      - ./certs-slave:/app/certs
      # 独立 WAF 目录：两节点的 CRS/IP2Region 每日更新会并发写共享目录，存在竞争
      - ./waf-slave:/app/waf
      # 与主节点共享备份目录：从节点不调度写入，仅目录存在以保配置路径一致
      - ./backup:/app/backup
    environment:
      - NODE_NAME=slave-test
      - LOG_FILE=/app/logs/lazy-balancer.log
    ulimits: *common-ulimits
    pids_limit: 4096
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck: *common-healthcheck

volumes:
  lb-data:
  lb-data-slave:
